# Example configuration file for PansimNuc
# This file demonstrates the config parser capabilities

[input]
# Input files
gff_file=/Users/samhorsfield/Software/PansimNuc/testing/Zymo_chr18_chr19.gff
fasta_file=/Users/samhorsfield/Software/PansimNuc/testing/Zymo_chr18_chr19.fasta
earlgrey_gff_file=/Users/samhorsfield/Software/PansimNuc/testing/Zymo_EarlGrey_chr18_chr19.gff

[output]
outdir=/Users/samhorsfield/Software/PansimNuc/1_vec_updates_profiling
compress=true

[population]
n_individuals=2000
n_generations=100
recombination_rate=1e-8
recombination_size_mean=10000.0
recombination_threshold=0.90
bidirectional_recombination=true
max_multiplier_dist=5000
population_splits=0
generation_splits=0
migration_rate=0.0

[exons]
mutation_rate=1e-8
indel_rate=1e-50
selection_distribution=uniform
selection_low=-1e-9
selection_high=1e-9
duplication_rate=1e-30
deletion_rate=1e-30
inversion_rate=1e-30

[introns]
mutation_rate=1e-8
indel_rate=1e-50
selection_distribution=uniform
selection_low=-1e-9
selection_high=1e-9
duplication_rate=1e-30
deletion_rate=1e-30
inversion_rate=1e-30

[intergenic]
mutation_rate=1e-8
indel_rate=1e-50
selection_distribution=uniform
selection_low=-1e-9
selection_high=1e-9
duplication_rate=1e-30
deletion_rate=1e-30
inversion_rate=1e-30

[TE-CUT]
mutation_rate=1e-8
indel_rate=1e-50
selection_distribution=uniform
selection_low=-1e-9
selection_high=1e-9
duplication_rate=1e-8
deletion_rate=1e-8
inversion_rate=1e-30
#multipler distribution is gamma
multiplier_rate=1.0
multiplier_scale=1.0

[TE-COPY]
mutation_rate=1e-8
indel_rate=1e-50
selection_distribution=uniform
selection_low=-1e-9
selection_high=1e-9
duplication_rate=1e-8
deletion_rate=1e-8
inversion_rate=1e-30
#multipler distribution is gamma
multiplier_rate=1.0
multiplier_scale=1.0

[misc]
threads=1
seed=42
verbose=true
print_DFE=true
print_all_generations=false
